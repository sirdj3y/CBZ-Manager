name: Image Docker

# main    → ghcr.io/sirdj3y/cbz-manager:latest + :<VERSION> + :sha-xxxxxxx (production, tirée par Watchtower)
# develop → :preprod
# autres branches / PR → build seulement, rien n'est publié (vérifie que le Dockerfile compile)
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cbz-manager

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version et tags
        id: meta
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          short=${GITHUB_SHA::7}
          push=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$IMAGE:latest,$IMAGE:$version,$IMAGE:sha-$short"; push=true
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            tags="$IMAGE:preprod,$IMAGE:sha-$short"; push=true
          else
            tags="$IMAGE:ci"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Version $version — tags : $tags — publication : $push" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 uniquement : le DS423+ est en Intel x86_64.
      # provenance: false évite les manifestes d'attestation sans tag, qui encombrent le registre.
      - name: Build (et publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push == 'true' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Les anciennes images qui ont perdu leur tag (latest/preprod déplacés) ne servent plus.
      - name: Purge des images sans tag
        if: steps.meta.outputs.push == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: cbz-manager
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
