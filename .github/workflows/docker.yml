name: Image Docker

# main    → ghcr.io/sirdj3y/cbz-manager:latest + :<VERSION> + :sha-xxxxxxx (production, tirée par Watchtower)
# develop → :preprod
# autres branches / PR → tests + build seulement, rien n'est publié
# Dans tous les cas, les tests (pytest + vitest) passent avant le build.
on:
  push:
    branches: ["**"]
    # Doc, maquettes et fichiers compose ne changent pas l'image : pas de rebuild,
    # donc pas de redémarrage inutile par Watchtower.
    paths-ignore: ["**.md", "design-tests/**", "docker-compose*.yml", ".env.example"]
  pull_request:
    paths-ignore: ["**.md", "design-tests/**", "docker-compose*.yml", ".env.example"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cbz-manager

jobs:
  # Les tests bloquent la publication : une image n'est construite que s'ils passent.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Même version de Python que l'image (python:3.11-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Tests backend (pytest)
        run: |
          pip install -r requirements-dev.txt
          python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tests frontend (vitest)
        working-directory: frontend
        run: |
          npm ci
          npm test

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Version et tags
        id: meta
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          short=${GITHUB_SHA::7}
          push=false
          channel=ci
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$IMAGE:latest,$IMAGE:$version,$IMAGE:sha-$short"; push=true; channel=prod
          elif [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/develop" ]; then
            tags="$IMAGE:preprod,$IMAGE:sha-$short"; push=true; channel=preprod
          else
            tags="$IMAGE:ci"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "Version $version — tags : $tags — publication : $push" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 uniquement : le DS423+ est en Intel x86_64.
      # provenance: false évite les manifestes d'attestation sans tag, qui encombrent le registre.
      - name: Build (et publication)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push == 'true' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          # Affichés dans l'app (bandeau préprod, page À propos) — voir vite.config.js.
          build-args: |
            APP_CHANNEL=${{ steps.meta.outputs.channel }}
            APP_GIT_SHA=${{ steps.meta.outputs.short }}
            APP_BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Les anciennes images qui ont perdu leur tag (latest/preprod déplacés) ne servent plus.
      - name: Purge des images sans tag
        if: steps.meta.outputs.push == 'true'
        uses: actions/delete-package-versions@v5
        with:
          package-name: cbz-manager
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0
