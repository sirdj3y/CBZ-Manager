# Préprod Synology — Container Manager → Projet → Créer, chemin : /volume1/docker/cbz-manager-preprod
#
# Image :preprod, construite par GitHub Actions à chaque push sur la branche develop.
# Mise à jour automatique par le Watchtower du projet cbz-manager (label ci-dessous).
#
# Isolation vis-à-vis de la prod :
# - data/ séparé, parti vide (base et comptes propres à la préprod)
# - bibliothèque de test dédiée, en lecture-écriture : tout se teste (ComicInfo, conversion,
#   renommage, import, suppression) sans risque pour la vraie bibliothèque

services:
  cbz-manager-preprod:
    image: ghcr.io/sirdj3y/cbz-manager:preprod
    container_name: cbz-manager-preprod
    restart: unless-stopped
    ports:
      - "5174:32123"
    volumes:
      - /volume1/docker/cbz-manager-preprod/data:/data
      - /volume1/divers/BD-preprod:/media
    environment:
      - MEDIA_ROOT=/media
      - DB_PATH=/data/cbzmanager.db
      - COVER_CACHE_DIR=/data/covers
      - PUID=1030   # propriétaire des fichiers de BD-preprod (prod : 1026)
      - PGID=100
      - TZ=Europe/Paris
      # Reverse proxy de DSM : dans Docker, il se présente avec l'adresse de passerelle du réseau
      # du projet (ex. 172.22.0.1). Plages Docker par défaut, pour que l'app lise l'IP réelle
      # des visiteurs et le HTTPS transmis par le proxy (voir routers/auth.py::get_client_ip).
      - TRUSTED_PROXY_IPS=127.0.0.1,::1,172.16.0.0/12
    labels:
      - com.centurylinklabs.watchtower.enable=true
