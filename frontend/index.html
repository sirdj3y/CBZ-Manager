<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBZ Manager</title>

    <!-- PWA — permet un vrai lancement "standalone" (sans barre d'adresse/barre du bas)
         depuis "Ajouter à l'écran d'accueil", au lieu d'une simple réouverture de Safari. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1E2A42" />

    <!-- Direction "Affiche" — Bebas Neue (titres) + Work Sans (UI) + IBM Plex Mono (chiffres/
         compteurs : compteurs de nav, stats, pourcentages, raccourci clavier — idée reprise
         d'une maquette de comparaison), chargées une fois pour toute l'app plutôt qu'injectées
         par page. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- iOS : le manifest standard seul n'est pas toujours suffisant sur Safari, ces
         balises historiques Apple restent nécessaires en complément. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CBZ Manager" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
